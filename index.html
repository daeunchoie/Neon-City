<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05020f"><meta name="apple-mobile-web-app-capable" content="yes">
<title>NEON WORLDS</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="game"></div>
<div id="bar"><button id="music" aria-label="Music">♪</button><button id="help" aria-label="Help">?</button><button id="save">Save</button><button id="reset">Reset</button></div>
<div id="panel" class="hidden">
  <div id="head"><span id="panel-title"></span><button id="close" aria-label="Close">✕</button></div>
  <div id="options"></div>
</div>
<div id="intro" class="hidden"><div class="card"><button id="intro-x" aria-label="Close">✕</button>
<h2>NEON WORLDS</h2><p>나만의 사이버펑크 도시를 꾸며 보세요.</p>
<ul><li>건물, 광고판, 비행체, 시민, 가로등, 육교, 하늘을 <b>탭</b>하면 아래 패널에서 색과 디자인을 바꿀 수 있어요.</li>
<li><b>Save</b>를 눌러야 도시가 저장돼요. (이 기기, 이 브라우저에만 저장돼요)</li>
<li><b>Reset</b>은 처음 모습으로 되돌려요.</li>
<li><b>♪</b>로 배경음악을 켜고 끌 수 있어요. (첫 터치 후에 재생돼요)</li>
<li>빈 곳을 탭하거나 ✕를 누르면 패널이 닫혀요. 이 안내는 오른쪽 위 <b>?</b>로 다시 볼 수 있어요.</li></ul>
<button id="intro-ok">시작하기</button></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
